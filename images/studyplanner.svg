<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>StudyPlanner — study schedule diagram</title>
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1a" />
      <stop offset="1" stop-color="#0f1330" />
    </linearGradient>
    <radialGradient id="sp-teal" cx="0.8" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#9db4ff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#9db4ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sp-azure" cx="0.06" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
    <pattern id="sp-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sp-bg)" />
