<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>ResQConnect — rescue coordination network</title>
  <defs>
    <linearGradient id="rq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1a" />
      <stop offset="1" stop-color="#0e1229" />
    </linearGradient>
    <radialGradient id="rq-signal" cx="0.18" cy="0.16" r="0.6">
      <stop offset="0" stop-color="#9db4ff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#9db4ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rq-counter" cx="0.9" cy="0.88" r="0.62">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
    <pattern id="rq-dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#rq-bg)" />
  <rect width="1600" height="1000" fill="url(#rq-dots)" />
  <rect width="1600" height="1000" fill="url(#rq-signal)" />
  <rect width="1600" height="1000" fill="url(#rq-counter)" />

  <g fill="none" stroke="#9db4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 800 520 620 800 720 1054 472 1330 590" stroke-opacity="0.85" />
    <path d="M520 620 640 330 900 250" stroke-opacity="0.4" stroke-dasharray="18 16" />
    <path d="M800 720 860 902" stroke-opacity="0.4" stroke-dasharray="18 16" />
    <path d="M1054 472 1330 300" stroke-opacity="0.55" />
  </g>

  <g>
    <circle cx="250" cy="800" r="46" fill="none" stroke="#9db4ff" stroke-opacity="0.22" stroke-width="2" />
    <circle cx="250" cy="800" r="15" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="520" cy="620" r="13" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="800" cy="720" r="13" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="640" cy="330" r="13" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="900" cy="250" r="13" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="1330" cy="300" r="13" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="860" cy="902" r="13" fill="#070a1a" stroke="#9db4ff" stroke-width="3" />
    <circle cx="1330" cy="590" r="64" fill="none" stroke="#7c5cff" stroke-opacity="0.28" stroke-width="2" />
    <circle cx="1330" cy="590" r="32" fill="none" stroke="#7c5cff" stroke-opacity="0.45" stroke-width="2" />
    <circle cx="1330" cy="590" r="14" fill="#0a0e24" stroke="#7c5cff" stroke-width="3" />
    <circle cx="1054" cy="472" r="12" fill="#9db4ff" />
  </g>

  <g transform="translate(1064 140)">
    <rect width="440" height="252" rx="26" fill="#0b0f28" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.09" />
    <circle cx="42" cy="46" r="9" fill="#9db4ff" />
    <rect x="66" y="38" width="180" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.07" />
    <rect x="34" y="92" width="372" height="14" rx="7" fill="#ffffff" fill-opacity="0.07" />
    <rect x="34" y="128" width="286" height="14" rx="7" fill="#ffffff" fill-opacity="0.05" />
    <rect x="34" y="182" width="132" height="44" rx="22" fill="#9db4ff" fill-opacity="0.85" />
    <rect x="180" y="182" width="106" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.16" />
  </g>

  <text
    x="96"
    y="890"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="26"
